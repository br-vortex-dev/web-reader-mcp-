services:
  - type: web
    name: web-reader-mcp
    runtime: node
    # Plano free: o projeto nao tem dependencias nem build, e o cold start e
    # curto porque o servidor sobe um processo Node puro. Para produto (sem
    # dormir e com mais RAM), troque para starter (~US$ 7/mes).
    plan: free
    buildCommand: echo "sem dependencias para instalar - zero-dep"
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Token de autenticacao: o Render gera um valor aleatorio e mostra no dashboard.
      # Sem ele, qualquer pessoa na internet pode usar seu MCP.
      - key: MCP_AUTH_TOKEN
        generateValue: true
      # ATENCAO: NAO defina ALLOW_PRIVATE_HOSTS aqui. Ela desliga o bloqueio de
      # hosts privados/internos (SSRF) e serve apenas para dev/testes locais.
      # O Render coloca um proxy na frente do app, entao o IP real do cliente
      # chega no x-forwarded-for: confiamos em 1 entrada contando da direita.
      - key: TRUST_PROXY_HOPS
        value: "1"
      # Rate limit: 10.000 req/min por cliente (janela de 60 s, como sempre).
      # Motivo: com o MCP atras de um site de IA, quem chama e o BACKEND do
      # site — todos os usuarios chegam com o MESMO IP. Com o padrao de
      # 60/min o balde era unico para o site inteiro e estourava com poucos
      # usuarios ativos. O teto real de uma instancia e de CPU (~18.600/min),
      # entao 10.000/min ainda cabe com folga; a protecao de capacidade
      # continua sendo a admissao (MAX_INFLIGHT_REQUESTS -> 503).
      - key: RATE_LIMIT_MAX
        value: "10000"
      # Cache: entradas vencidas são servidas na hora e revalidadas atrás
      # (stale-while-revalidate). Junto com a junção de buscas em voo (código),
      # é o que impede uma rajada nas MESMAS URLs de virar uma rajada de
      # downloads: quem chega no vencimento recebe a versão em cache sem
      # esperar, e a atualização acontece uma vez só, atrás.
      - key: CACHE_SWR
        value: "1"
