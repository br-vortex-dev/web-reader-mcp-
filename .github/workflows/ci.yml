name: ci

# O projeto não tem dependências, por isso não há `npm install` nem lockfile a
# restaurar: só Node e a suite própria. Cada push corre o lint de imports, os 39
# ficheiros de teste (~1 min) e o ponta a ponta pelo stdio.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `engines.node` declara >=18; testamos o piso e o que roda no Render.
        node: ["18", "22"]
    steps:
      - uses: actions/checkout@v4

      - name: Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Lint de imports (nenhum import para ficheiro que não existe)
        run: node scripts/check-imports.mjs

      - name: Suite
        run: npm test

      # O smoke test fala com sites reais, e eles falham: `example.com` respondeu
      # 503 numa corrida do Node 18 e 200 em tudo o resto (o produto já tenta o
      # 503 — src/fetch.mjs). Uma janela má do site não é regressão do código,
      # então há novas tentativas; três falhas seguidas já são sinal de outra coisa.
      - name: Ponta a ponta pelo stdio
        run: |
          for tentativa in 1 2 3; do
            if npm run test:e2e; then
              exit 0
            fi
            echo "tentativa $tentativa/3 falhou (rede externa?); a tentar de novo..."
            sleep 30
          done
          echo "o smoke test falhou 3 vezes seguidas"
          exit 1
